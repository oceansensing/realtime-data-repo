# The declaration. Everything the pipeline knows about a product is in this
# file, and everything else — fetch steps, validation, manifests, cache keys,
# what the published branch carries — is derived from it by orchestrate.py.
#
# The predecessor kept this knowledge in five hand-maintained lists across a
# workflow file, and each drifted silently on the newest product. If a change
# needs a list edited anywhere else, that is a bug in the derivation, not a
# step to remember.
#
# A **step** is one invocation of one fetch script, run from the site
# checkout. A **product** is a set of files that are true together, owned by
# exactly one step. Two products may share a step (the fields script writes
# both the Navy and the OISST families in one run) — that is what lets one
# family fail without holding the other.

[contract]
# The consumer's own gate, run over the assembled tree from the site
# checkout. `roots` prints every file the map reads, from **every** origin —
# so this repository's products declare a *subset* of it, and the orchestrator
# refuses to run on a root declared here that the contract does not publish.
#
# It does not fail on the other direction, and that is the split: a contract
# root no product here declares belongs to another origin's products.toml,
# which this run cannot see. The union — every root owned by exactly one
# origin — is checked by `check:docs` in the site repository, which reads
# MAP_ORIGINS and every origin's declarations at once. Failing here instead
# would stop this repository's publish over a gap in another's.
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

# The static half: committed in this repository under map/ and copied into
# every artifact by assemble, because the seafloor does not change and
# cannot be rebuilt in CI (contouring GEBCO needs a 7.5 GB grid run by
# hand). **Declared, because it went missing silently once**: the cutover
# carried every pipeline and no static file, and the isobaths, the offline
# coastline and the borders were dead on the live site for a day — each a
# lazy layer whose 404 degrades to nothing. Assemble refuses to run when
# one of these is absent: a missing static is a repository defect, not an
# upstream outage, and failing loudly is the correct fate for it.
[static]
required = ["bathy-deep.json", "bathy-tiles", "boundaries.json", "coastline.json"]

[defaults]
timeout_minutes = 30

# --- steps ------------------------------------------------------------------
# `lane` names the upstream a step leans on. Steps in different lanes run
# concurrently; steps in the same lane queue. Two HYCOM reads competing for
# the same THREDDS server help nobody, least of all HYCOM.

[steps.assets]
cmd = ["python3", "scripts/fetch-ocean-assets.py"]
lane = "noaa"
timeout_minutes = 15

# **`--only=oisst` since 2026-08-31, and this is not optional.** The script
# publishes four families; three of them left for `espc-model-fields-repo` with
# their products. Left bare, this step would go on fetching the Navy fields and
# writing `sst-navy.json` and its siblings into a tree where no product
# declares them any more — and the write fence would refuse the whole run:
# `FENCE  sst-navy.json: written by no declared namespace`. Not a slow
# degradation, an immediate stop for every product here.
#
# So the step's scope and the product list are one change, never two. A
# product is the unit of ownership; a step is the unit of execution; the fence
# is what holds them to each other. The other repository met this from the
# opposite side on its first run.
[steps.fields]
cmd = ["python3", "scripts/fetch-ocean-fields.py", "--only=oisst"]
lane = "hycom"

[steps.wind]
cmd = ["python3", "scripts/fetch-wind.py"]
lane = "ecmwf"
timeout_minutes = 20

[steps.waves]
cmd = ["python3", "scripts/fetch-waves.py"]
lane = "ecmwf"
timeout_minutes = 20

# --- products ---------------------------------------------------------------
# `roots` are the files nothing else links to — the map's entry points, and
#   the level the contract's own `--roots` list is checked against.
# `writes` is the product's namespace: every filename its step may create,
#   as globs. A step writing outside every product's namespace fails the run
#   outright. Held products are restored from the seed by these same globs,
#   which is what makes the restore exact rather than a hand-kept list.
# `max_age_hours` is how far the NEAREST PUBLISHED FRAME may sit from the
#   reader's clock before the status calls the product stale — sized to each
#   product's own cadence, not to the cron. `checked` going quiet is flagged
#   for every product alike.
#
#   **It measured `updated` until 2026-08-27, and that was the wrong
#   quantity.** `updated` is when this pipeline last PUBLISHED, so a run that
#   republishes a nine-hour-old field every hour reported perfectly fresh. On
#   2026-08-27 every product on both origins said `stale: false` while the
#   Navy fields sat nine hours behind and OISST forty-three; both were found
#   by the owner looking at the map, with every suite green. A product with no
#   valid hour at all — the observation sets — has nothing to measure and is
#   left alone, as before.
#
#   Going past the budget is only a FAULT when the product's fate is not
#   `fresh`: old-but-fetched means upstream has nothing newer, which is a note
#   and not this repository's doing. See `nearest_frame_age` in
#   orchestrate.py.
#
#   **Every number here was re-derived on 2026-08-27, and the old ones should
#   not be trusted as precedent.** They were all calibrated against `updated`,
#   where they answered a different question, and against the hour they were
#   simply wrong: the ESPC products sat at nine when their frames bracket the
#   reader inside 1.5, and `assets` at four for a SIX-HOURLY product, which
#   would have fired for half of every cycle. Size each one to its product's
#   own cadence plus the delay its upstream takes to publish, and no tighter —
#   an alarm that is usually on is an alarm nobody reads, and this project has
#   measured that once already (CLAUDE.md, on red CI).
#
# There is no cross-product agreement declared here, on purpose. How the
# ESPC members must relate is the consumer contract's rule (test-schema.mjs
# owns it, frames and run-raggedness included), and a copy of it here was
# wrong on the first live run. The gate demotes the offending product when
# the contract objects; see the note in orchestrate.py's cmd_run.

[products.assets]
title = "Storms, gliders, USVs and Argo floats"
step = "assets"
roots = ["ocean-assets.json", "argo.json", "wsp34.json", "wsp50.json", "wsp64.json"]
writes = ["ocean-assets.json", "argo.json", "wsp34.json", "wsp50.json", "wsp64.json"]
# Ten, and the bound is derived rather than tuned: NHC issues the
# wind-speed probabilities at 00/06/12/18Z, so a 6 h cycle, plus the
# time they take to appear. **The delay is the part I sized wrong
# twice.** Four was an `updated` number and fired immediately. Eight
# assumed "an hour or two" and was still short — measured 2026-08-27
# at 19:54Z, the newest product on hand was 12:00Z, so the 18Z had
# not landed nearly two hours after its synoptic time and the age was
# 7.92 h and climbing. Six for the cycle, three for issuance, one for
# margin.
#
# **The honest fix is upstream of this number**: `hour` here is the
# SYNOPTIC time, so a product's age counts from a moment NHC had not
# yet published it for. Were it the issuance time, the budget would
# be about the cycle alone and would not need a delay term at all.
# Worth doing if this proves noisy; recorded so the next person
# sizing it knows the number is compensating for the wrong clock.
max_age_hours = 10

# Its own product on the assets step — the fields pattern, one fetch feeding
# two products — so an NDBC outage holds the buoys and nothing else. The
# collector keeps the previous file on failure, and this file's absence from
# a cold seed is ordinary: the contract's buoys check is presence-conditional.
[products.buoys]
title = "NDBC buoys and coastal stations"
step = "assets"
roots = ["buoys.json"]
writes = ["buoys.json"]
max_age_hours = 4

# Same pattern again. Note the seed matters more here than anywhere: each
# station's published prediction curve is what spares the rate-banning
# CO-OPS API a re-fetch every run, so a cold seed costs the first run about
# seven paced minutes and a warm one costs ninety seconds.
[products.tides]
title = "CO-OPS tide gauges"
step = "assets"
roots = ["tides.json"]
writes = ["tides.json"]
max_age_hours = 4

[products.gtmba]
title = "Tropical moored arrays (GTMBA)"
step = "assets"
roots = ["gtmba.json"]
writes = ["gtmba.json"]
max_age_hours = 4

# The US academic research fleet, on the assets step like the stations above.
# Two upstreams behind one product: R2R's registry decides which call signs
# are research vessels and OSMC's GTS feed says where they are, so the
# collector keeps the previous file if either is unreadable — a thinner fleet
# would be indistinguishable from ships being in port.
#
# **Declaring it here is not paperwork**, and this block is why the check
# that enforces it moved. `run` used to compare every product's roots against
# `test-schema.mjs --roots` in both directions and exit 2 on any
# disagreement, so a file added to the contract and not to this table stopped
# the whole publish: measured 2026-08-18, three consecutive runs failed with
# `ROOTS ships.json: in the contract, declared by no product` before this
# block existed. That was right while one repository published the whole
# contract and became wrong the moment a second one did — the same message
# would now fire on every root ESPC took with it. The gap is still caught,
# by `check:docs` on the site, where the whole picture is.
[products.ships]
title = "US academic research fleet"
step = "assets"
roots = ["ships.json"]
writes = ["ships.json"]
max_age_hours = 4

[products.sondes]
title = "Radiosondes aloft (SondeHub)"
step = "assets"
roots = ["sondes.json"]
writes = ["sondes.json"]
# **Shorter than any other product here, and deliberately.** A radiosonde
# flight lasts about two hours and the layer claims to show what is in the
# air *now*; the site publishes only sondes heard within 30 minutes, so a
# file more than an hour or two old is describing balloons that have
# landed. Every other product ages into staleness gracefully — a glider
# position from four hours ago is still roughly where the glider is — and
# this one does not.
max_age_hours = 2
# **The five Navy scalar roots LEFT on 2026-08-31**, for
# `espc-model-fields-repo`: `sst-navy.json` and `sss-navy.json` (was
# `fields-navy`), `sic-navy.json` and `sit-navy.json` (was `ice-navy`), and
# `ssh-navy.json`. The currents had already gone to `espc-model-repo` on
# 2026-08-22; this is the rest of the model following, under the split that
# gives every model a currents half and a fields half.
#
# **The ice was the live test and it passed.** It stayed behind in August
# deliberately, to prove that moving one product between repositories is a
# declaration rather than a rewrite. Moving it cost this block and one line
# in the site's `MAP_ORIGINS`.
#
# **What that leaves on the `fields` step here: `fields-oisst`, alone.** The
# step is unchanged and so is the script — `fetch-ocean-fields.py` still
# publishes all four families and still lives in the site repository. What
# moved is ownership, which is what a product is.
#
# **The partition still has to hold, and it now holds ACROSS repositories.**
# `test:probes` on the site asserts that the four `--only` selections —
# `sst-navy,sss-navy`, `sic-navy,sit-navy`, `ssh-navy`, `oisst` — between them
# name every file the script publishes, as set equality against the
# unselected answer. Three of those four are declared in
# `espc-model-fields-repo` now and one here. A file owned by nobody is
# written by nobody, carried by the seed for ever, and served frozen — the
# 43.8 MB shape.

[products.fields-oisst]
title = "NOAA OISST temperature, anomaly and ice"
step = "fields"
roots = ["sst-oisst.json", "ssta-oisst.json", "sic-oisst.json"]
writes = ["sst-oisst*.json", "ssta-oisst*.json", "sic-oisst*.json"]
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=oisst"]
# A daily analysis that lands mid-morning UTC and describes yesterday:
# two days of quiet is routine, three is not.
max_age_hours = 60

[products.wind]
# Four fields off one fetch: the 10 m wind pair, the 2 m air temperature, the
# total cloud cover and the 850 hPa air temperature, all from one ECMWF index
# on one step of one run, so each is a byte-range read rather than a source of
# its own. The script degrades per field — a missing `tcc` costs the cloud
# alone and leaves the wind and the air standing — which is why all four are
# named here rather than trusting one to stand for the others.
#
# The 500 hPa height contours joined on the same day and are the one product
# in this repository that is not a grid: the field is traced to GeoJSON lines
# in the pipeline, 42 KB gzipped against the 0.41 MB message, because a
# contour chart is how the quantity is read. `writes` gained `gh-*.json` for
# it — the existing globs matched nothing beginning `gh`.
#
# 850 hPa is the first pressure level this fetch takes (2026-08-22). It is the
# same index and the same file, 604,672 bytes measured on the 12z run's step
# 0, against a 136 MB whole step. `writes` needed nothing: `air*.json` already
# matched it, which is a glob doing its job and also the reason `roots` has to
# be explicit — a file this repository fetches but does not declare is one the
# contract cannot see.
title = "ECMWF 10 m wind, 2 m and 850 hPa temperature, cloud cover and 500 hPa heights"
step = "wind"
roots = ["wind.json", "air.json", "cloud.json", "air-850.json", "gh-500.json"]
writes = ["wind*.json", "air*.json", "cloud*.json", "gh-*.json"]
# Four. ECMWF runs 6-hourly with 3-hourly steps, and the published
# frame tracked the reader at 1.4 h when this was measured
# (2026-08-27). Thirteen was an `updated` number and would have let
# these go half a day stale in silence.
max_age_hours = 4

[products.waves]
title = "ECWAM significant wave height"
step = "waves"
roots = ["waves.json"]
writes = ["waves*.json"]
# Four. ECMWF runs 6-hourly with 3-hourly steps, and the published
# frame tracked the reader at 1.4 h when this was measured
# (2026-08-27). Thirteen was an `updated` number and would have let
# these go half a day stale in silence.
max_age_hours = 4
