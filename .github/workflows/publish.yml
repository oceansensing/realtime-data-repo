name: Publish realtime ocean data

# Thin on purpose. The predecessor's workflow was 494 lines of bash-in-YAML,
# and the night it broke, four of the six faults lived in that bash — grep
# exit codes under `-e`, cache bookkeeping, a guard reading a deliberate
# state as damage. Everything with a decision in it now lives in
# pipeline/orchestrate.py, which has unit tests and runs the same way on a
# laptop. This file is checkouts, caches, and two uploads.
#
# The full run is at :35, offset from the predecessor's :05 so the two
# pipelines' tile rebuilds do not land on HYCOM together — GitHub dispatches
# scheduled runs 19–37 minutes late (measured), so nominal :35 runs land
# roughly :54–:12, against the predecessor's :24–:42.
#
# The boundary run at :02 exists because the six-hour publish window turns
# at 00, 06, 12 and 18Z, and its first rebuild otherwise waits for the :35
# cron plus the dispatch delay plus the build — measured on screen as the
# ESPC layers ageing to ~4.3 h at every window's tail before the turn
# published (~13:12–13:30 for a 12:00 window). Nominal :02 dispatches
# ~:21–:39 and publishes the new window inside its own hour, holding the
# tail near 3.7 h. It needs no mode plumbing: any schedule string that is
# not the light one falls through to full. Until the predecessor is frozen
# its own :05 full run lands ~:24–:42, so the two overlap at these four
# hours a day — accepted as transient, since the standby's output feeds
# nothing and the freeze is the standing plan.
#
# **There is no push trigger, and there was one until 2026-08-21.** It ran
# `full` — the mode selector treats anything that is not the light cron
# string as full, deliberately — so a push that changed one markdown file
# started a complete fetch of every product. Measured on exactly that: 56
# minutes against a light run's 5, and because this workflow is
# `concurrency: publish` with `cancel-in-progress: false` a new run cannot
# cancel the one in flight, it queues; each arrival then cancels the
# previously queued one. Three consecutive scheduled runs were cancelled and
# nothing published between 03:16 and 04:28, on a schedule that promises
# three an hour. Nothing on screen said so — the map's staleness note needs
# three hours.
#
# Making a push run *light* was the other candidate and is worse for the case
# that matters. A push here is usually a change to a fetcher or to the
# orchestrator, and a light run executes one of the five steps: you would be
# watching a run that did not do the thing you changed, which is the
# deploy-and-watch habit defeated rather than served. `workflow_dispatch`
# makes the choice explicit instead — push freely, then dispatch a full run
# when there is something to watch. It defaults to full for the same
# safe-direction reason the mode selector does.
#
# Nothing is lost by waiting: an unpushed change is picked up by the next
# scheduled run either way, within about twenty minutes for a light one.
#
# The light runs at :15 and :55 refresh the storms and platforms only,
# spreading three publishes across the hour, because the NHC does not
# publish on our schedule — an advisory every three hours, every two under
# watches, a special one whenever a forecaster judges it. The dispatch
# delay shuffles the spacing per run, so this buys three publishes an hour
# rather than three evenly spaced ones; nothing downstream may assume a
# publish lands at its nominal time. What a light run does and refuses to
# do is the orchestrator's business — see the light path in
# pipeline/orchestrate.py and the gap guard note in the README.

on:
  schedule:
    - cron: '35 * * * *'
    - cron: '2 0,6,12,18 * * *'
    - cron: '15,55 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full fetches everything; light only the storm products'
        type: choice
        options: [full, light]
        default: full

# Nothing at workflow level: each job says what it holds, and the job that
# runs `pip install` and the fetchers holds nothing worth stealing.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    steps:
      # This repository first: actions/checkout cleans its destination, so
      # taking the root after site/ would wipe it.
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The fetchers and the contract, one copy each, in the repository the
      # map lives in.
      - name: Check out the pipelines
        id: pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          # **This reads another repository, and the deploy key below is the
          # only reason it can.** The site repository went private on
          # 2026-08-17. With no credential here `actions/checkout` falls back
          # to this workflow's own `GITHUB_TOKEN`, which is scoped to *this*
          # repository and holds no grant on the site at all — so that path
          # is now a 404, and it would take down not one product but every
          # one of them, nothing fetched at all.
          #
          # **It was proved before it was needed, which is why the switch was
          # uneventful.** `ssh-key` empty is falsy inside `actions/checkout`,
          # which then takes its token path — so the line was landed and run
          # green while the site was still public and anonymous read was
          # doing the work, and only then was the secret set. Trying a
          # credential for the first time in the same change that removes the
          # safety net is how an outage gets two causes. Verified again on
          # the day itself: a dispatched run checked the private repository
          # out and published end to end.
          #
          # The hazard the order has to respect is that the secret **arms**
          # this path the moment it exists — a non-empty `ssh-key` sends
          # `actions/checkout` down SSH and the HTTPS fallback is not
          # consulted — so the key must be on the site repo before the secret
          # is set here. Measured the hard way: secret at 21:00, key at
          # 21:03, and the 21:00 scheduled run failed in between.
          #
          # A deploy key over a PAT or an App, chosen on what this step
          # actually needs: it reads exactly one repository and writes
          # nothing. A deploy key is scoped to one repository and read-only
          # *by construction* rather than by configuration, it does not
          # expire — where a fine-grained PAT stops the whole pipeline dead
          # on its expiry date — and it belongs to no person, so it survives
          # somebody leaving the org. The public half goes on the site repo's
          # Deploy keys page with **write access unchecked**; the private
          # half is the secret below. Neither is ever committed. README.md
          # carries the order of operations.
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}

      # **The message a failure gives is not the message anybody needs.**
      # Over HTTPS `actions/checkout` says "Repository not found", which is
      # true and points at the wrong thing — the repository is fine, the
      # credential is missing; over SSH it says "Permission denied
      # (publickey)", which names the mechanism and not the fix. Scoped to
      # this step's own outcome rather than a bare `if: failure()`, which
      # would attach this explanation to any earlier failure in the job and
      # so describe the wrong fault — the label-that-names-something-else
      # shape.
      # **The message a failure gives is not the message anybody needs**, and
      # this step's own first real failure proved it. It used to say: if the
      # secret is set, check the key is on the site repository and not
      # revoked. The failure when it came was neither — the log said
      # `Load key ...: error in libcrypto`, meaning the private key could not
      # be *parsed*, so ssh offered none and the server denied it. Not an
      # access problem at all, and the reader was sent to two places that
      # were both fine.
      #
      # Three failures look alike in a step summary and want different
      # answers, so this branches on the line the log actually carries rather
      # than listing causes in prose. **A message that points at the wrong
      # thing is worse than none**, because it is believed.
      #
      # Corrected in espc-model-repo the day it happened and left here for
      # another day: the copy was fixed and the original was not, which is
      # the shape this project keeps paying for.
      - name: Say why the pipelines could not be checked out
        if: failure() && steps.pipelines.outcome == 'failure'
        run: |
          echo "::error title=Cannot read the pipelines::Could not check out oceansensing/oceansensing.github.io. Read the step log before assuming which of these it is - they need different fixes and the messages look alike."
          echo "::error title=If the log says 'error in libcrypto'::The private key could not be PARSED, so ssh offered none and the server denied it. Not an access problem. Almost always a missing trailing newline on the PIPELINES_SSH_KEY secret - an OpenSSH key must end with a newline after -----END OPENSSH PRIVATE KEY-----, and pasting by hand usually drops it. Re-paste the whole file (pbcopy < keyfile). Less likely: the .pub half pasted by mistake, or a passphrase on the key."
          echo "::error title=If the log says only 'Permission denied (publickey)'::The key parsed but the server would not take it. The public half is missing from the site repository's Deploy keys page, or was revoked, or does not match this private half."
          echo "::error title=If the log says 'Repository not found'::No credential was used at all - the secret is unset or empty, so actions/checkout fell back to this workflow's GITHUB_TOKEN, which holds no grant on the site repository."

      # The last publish — the seed, the previous manifests, and the whole
      # of what a held product falls back to. Tolerated missing exactly
      # once: before the branch has ever been pushed, the orchestrator
      # starts cold and says so.
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # A broken orchestrator refuses to run, rather than publishing
      # something strange with green ticks.
      - name: Unit-test the orchestrator
        run: python3 pipeline/test_orchestrate.py

      # `github.event.schedule` is the literal cron string — the only signal
      # distinguishing the two schedules. An unqualified dispatch defaults to
      # full, the safe direction: a light run that was meant to be full
      # publishes an hour-old ocean with nothing saying so. The `else` branch
      # covered pushes too until the push trigger was dropped; it is kept
      # rather than narrowed, because a trigger added later should land on
      # full for that same reason and not on whatever the fallthrough happens
      # to be.
      - name: Decide the mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15,55 * * * *" ]; then
            echo "mode=light" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed the stage from the last publish
        run: python3 pipeline/orchestrate.py seed

      - name: Plan the run
        id: plan
        run: python3 pipeline/orchestrate.py plan --mode "${{ steps.mode.outputs.mode }}"

      # The one Python dependency in the whole pipeline: ECMWF packs its
      # open GRIB2 with CCSDS, which nothing in the standard library reads.
      - name: Install the ECMWF pipelines' dependency
        if: steps.mode.outputs.mode != 'light'
        run: pip install -r site/scripts/requirements-wind.txt

      # The caches are transport, not truth: whatever they restore is
      # verified against the grids by content before it is believed, so a
      # wrong or partial entry is rebuilt rather than republished. Restore
      # and save are split so nothing is ever saved that this run did not
      # build — the predecessor's combined step saved what a light run had
      # only borrowed.
      - name: Restore current tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-currents-tiles }}
          key: ${{ steps.plan.outputs.cache-key-currents-tiles }}
          restore-keys: ${{ steps.mode.outputs.mode == 'light' && steps.plan.outputs.cache-prefix-currents-tiles || '' }}

      - name: Restore field tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-field-tiles }}
          key: ${{ steps.plan.outputs.cache-key-field-tiles }}
          restore-keys: ${{ steps.mode.outputs.mode == 'light' && steps.plan.outputs.cache-prefix-field-tiles || '' }}

      # **One Restore and one Save per `cache` name in products.toml, and
      # this pair is the list a new product silently escapes.** The
      # orchestrator emits `cache-key-<name>` for every product that declares
      # tiles; nothing here loops, because a matrix would need separate jobs.
      # So `plan` names any cache with neither step, which is the only tell
      # there would be — a cache nothing restores is not an error, it is
      # tiles rebuilt from scratch every run, and the output is correct.
      - name: Restore ice tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-ice-tiles }}
          key: ${{ steps.plan.outputs.cache-key-ice-tiles }}
          restore-keys: ${{ steps.mode.outputs.mode == 'light' && steps.plan.outputs.cache-prefix-ice-tiles || '' }}

      # For the consumer's contract check, which the orchestrator runs
      # itself over the assembled tree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch, validate, assemble
        id: run
        run: python3 pipeline/orchestrate.py run

      - name: Save current tiles
        if: steps.run.outputs.built-currents-tiles == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-currents-tiles }}
          key: ${{ steps.plan.outputs.cache-key-currents-tiles }}

      - name: Save field tiles
        if: steps.run.outputs.built-field-tiles == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-field-tiles }}
          key: ${{ steps.plan.outputs.cache-key-field-tiles }}

      - name: Save ice tiles
        if: steps.run.outputs.built-ice-tiles == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.cache-paths-ice-tiles }}
          key: ${{ steps.plan.outputs.cache-key-ice-tiles }}

      - name: Upload the site
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

      # The branch content uploads even when the deploy is refused: a light
      # run that cannot deploy still banks its storms for the next run.
      - name: Upload the branch content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-content
          path: branch-out
          retention-days: 1
          include-hidden-files: true

  # The only job with write tokens, and it runs no third-party code: two
  # pinned first-party actions and ten lines of git.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the branch content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-content
          path: branch-out

      # One orphan commit, force-pushed: the branch is a snapshot, not a
      # history, so the repository does not grow by the hour. This is what
      # makes the accumulated products — tracks, storm histories — durable
      # rather than resident in an evictable cache.
      - name: Publish the branch
        run: |
          cd branch-out
          git init -q -b published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "publish $(date -u +%FT%TZ)"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            published

      - name: Configure Pages
        if: needs.build.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy
        id: deploy
        if: needs.build.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
